name: Release Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Azul Zulu JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
    - name: Build with Gradle
      run: ./gradlew.bat build -x check -Pwarn
      env:
        JAVA_TOOL_OPTIONS: -Ddeprecation=false
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: IsekaiAuctions-3.1.jar
        path: build/libs/IsekaiAuctions-3.1.jar

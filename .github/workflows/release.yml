name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Azul Zulu JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Build with Gradle
        run: ./gradlew.bat build -x check -Pwarn
        env:
          JAVA_TOOL_OPTIONS: -Ddeprecation=false
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/IsekaiAuctions-*.jar
          tag_name: ${{ github.ref_name }}
          name: IsekaiAuctions ${{ github.ref_name }}
          body: "Auto release based on latest tag"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

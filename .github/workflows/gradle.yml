name: Java CI with Gradle & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write for release creation

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Grab full history for commit info

    - name: Set up JDK 21 (Azul Zulu)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Get latest commit info
      id: commit
      run: |
        echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
        echo "COMMIT_SHA=$(git log -1 --pretty=%h)" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.commit.outputs.COMMIT_SHA }}
        release_name: Release ${{ steps.commit.outputs.COMMIT_SHA }}
        body: ${{ steps.commit.outputs.COMMIT_MESSAGE }}
        draft: false
        prerelease: false

    - name: Upload JAR to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ./build/libs/*.jar
        asset_name: project-${{ steps.commit.outputs.COMMIT_SHA }}.jar
        asset_content_type: application/java-archive

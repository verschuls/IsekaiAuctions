plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-rc2'
}

group = 'me.verschuls'
version = '3.1'

repositories {
    mavenCentral()
    maven { url = 'https://repo.nightexpressdev.com/releases' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.codemc.io/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.techscode.com/repository/techscode-apis/' }
    maven { url = 'https://repo.auxilor.io/repository/maven-public/' }
    maven { url = 'https://repo.rosewooddev.io/repository/public/' }
    maven { url = 'https://ci.frostcast.net/plugin/repository/everything' }
    maven{ url = 'https://repo.panda-lang.org/releases'}
}

dependencies {
    // Minecraft
    compileOnly 'dev.folia:folia-api:1.20.1-R0.1-SNAPSHOT'

    compileOnly 'su.nightexpress.coinsengine:CoinsEngine:2.5.2'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.arcaniax:HeadDatabase-API:1.3.2'
    compileOnly 'com.github.angeschossen:LandsAPI:7.17.2'
    compileOnly 'com.gitlab.ruany:LiteBansAPI:0.6.1'
    compileOnly ('com.github.DevLeoko:AdvancedBan:v2.3.0') {
        exclude group: 'org.bstats', module: 'bstats-bukkit'
        exclude group: 'org.bstats', module: 'bstats-bungeecord'
    }
    compileOnly 'me.TechsCode:UltraEconomyAPI:1.1.2'
    compileOnly 'me.confuser.banmanager:BanManagerBukkit:7.9.0'
    compileOnly 'org.black_ixx:playerpoints:3.3.0'

    // Database
    implementation 'io.lettuce:lettuce-core:6.8.1.RELEASE'
    implementation 'org.jdbi:jdbi3-core:3.49.6'
    implementation 'org.jdbi:jdbi3-sqlobject:3.49.6'
    implementation 'com.zaxxer:HikariCP:7.0.0'
    compileOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.4'

    // MC Utils?
    implementation 'net.wesjd:anvilgui:1.10.8-SNAPSHOT'
    implementation 'de.rapha149.signgui:signgui:2.5.4'
    implementation 'net.objecthunter:exp4j:0.4.8'

    // MC Utils For Sure
    implementation 'dev.rollczi:litecommands-folia:3.10.4'
    implementation 'dev.rollczi:litecommands-luckperms:3.10.4'

    // Utils
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation(fileTree("libs/impl"))
    compileOnly(fileTree("libs/comp")) // Mainly includes CMI version of Vault
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}


shadowJar {
    def libs = "me.verschuls.isekaiauctions.libs."

    relocate 'net.wesjd.anvilgui', libs+'anvilgui'
    relocate 'de.rapha149.signgui', libs+'signgui'
    relocate 'lombok', libs+'lombok'
    relocate 'org.jdbi', libs+'jdbi'
    relocate 'com.zaxxer.hikari', libs+'hikari'
    relocate 'dev.rollczi.litecommands', libs+'litecommands'
    relocate 'redis', libs+'redis'
    relocate 'reactor', libs+'reactor'
    relocate 'net.objecthunter.exp4j', libs+'exp4j'
    relocate 'io.netty', libs+'netty'
    relocate 'io.lettuce', libs+'lettuce'
    relocate 'io.leangen.geantyref', libs+'geantyref'
    relocate 'org.reactivestreams', libs+'reactivestreams'

    exclude { details ->
        details.path.contains('SCL')
    }

    exclude 'org/intellij/**'
    exclude 'org/jetbrains/**'
    exclude 'dev/dejvokep/**'
    exclude 'org/slf4j/**'
    exclude 'com/fasterxml/**'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'

    // Handle duplicate files
    mergeServiceFiles()

    // Handle duplicate META-INF files
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.properties'
    exclude 'META-INF'
    exclude 'LICENSE*'
    exclude 'AUTHORS*'
    exclude 'README*'
    exclude '*.html'
    exclude '*.txt'

    dependencies {
        exclude(dependency('org.jetbrains:annotations'))
    }

    archiveClassifier.set('')
    archiveFileName.set("${project.name}-${version}.jar")

}

// Make 'build' task depend on 'shadowJar'
build.dependsOn {
    shadowJar
}